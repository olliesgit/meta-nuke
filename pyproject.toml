[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-nuke"
version = "1.4.0"
description = "Forensically-safe offline metadata stripper"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "olliesgit"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: X11 Applications",
]
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.10.0"]
pdf = ["PyMuPDF>=1.23.0"]
progress = ["tqdm>=4.60.0"]
# Pinned <0.4.4: tkinterdnd2 0.4.4+ ships osx-arm64/libtcl9tkdnd*.dylib compiled
# for Tcl 9 only, which fails to load against CPython's Tcl/Tk 8.6 on Apple
# Silicon ("interpreter uses an incompatible stubs mechanism"). 0.4.3 and
# earlier ship a matching arm64 + Tcl 8.6 binary so drag-and-drop actually works.
gui = ["tkinterdnd2>=0.4.2,<0.4.4"]
fast = ["numpy>=1.21.0"]
all = [
    "pillow-heif>=0.10.0",
    "PyMuPDF>=1.23.0",
    "tqdm>=4.60.0",
    "tkinterdnd2>=0.4.2,<0.5",
    "numpy>=1.21.0",
]

[project.scripts]
meta-nuke = "metanuke.cli:main"
metanuke = "metanuke.cli:main"

[tool.setuptools.packages.find]
include = ["metanuke*"]
