[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-nuke"
version = "1.3.0"
description = "Forensically-safe offline metadata stripper"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "olliesgit"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: X11 Applications",
]
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.10.0"]
pdf = ["PyMuPDF>=1.23.0"]
progress = ["tqdm>=4.60.0"]
# Pinned <0.5: tkinterdnd2 0.5.0 ships only a Tcl 9 tkdnd build for
# osx-arm64, which fails to load against the Tcl/Tk 8.6 that ships with
# CPython on Apple Silicon ("Unable to load tkdnd library"). 0.4.x ships a
# matching arm64 + Tcl 8.6 binary, so drag-and-drop actually works.
gui = ["tkinterdnd2>=0.4.2,<0.5"]
fast = ["numpy>=1.21.0"]
all = [
    "pillow-heif>=0.10.0",
    "PyMuPDF>=1.23.0",
    "tqdm>=4.60.0",
    "tkinterdnd2>=0.4.2,<0.5",
    "numpy>=1.21.0",
]

[project.scripts]
meta-nuke = "metanuke.cli:main"
metanuke = "metanuke.cli:main"

[tool.setuptools.packages.find]
include = ["metanuke*"]
